version: 2.1

jobs:
  y7:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Compute 2
          command: |
            mkdir -p /tmp/recorder
            set +o pipefail 2>/dev/null; head -c 962513 /dev/urandom | base32 > /tmp/recorder/v; true
            echo "written-E"
      - persist_to_workspace:
          root: /tmp/recorder
          paths:
            - 'v'
  push-it:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/recorder
      - run:
          name: Review handoff data
          command: |
            { tail -c 1024 /tmp/recorder/v > /dev/null; echo "tail1k ok" ; } || true
      - run:
          name: Fetch minimal
          command: git clone --depth 2 --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Expand sources
          command: tar --extract --file=release-images-prod.tar
      - run:
          command: g++ --version
      - run:
          name: Record build info
          command: cat /proc/cpuinfo | head -5
      - run:
          command: taskset -c 0-3 ./init-edge
  text-honey:
    docker:
      - image: cimg/base:current
